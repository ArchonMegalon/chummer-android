name: API 36 phone beta editing E2E

on:
  pull_request:
    paths:
      - ".github/workflows/api36-editing-e2e.yml"
      - "docs/ANDROID_CHUMMER5_EDITABILITY_INVENTORY.generated.json"
      - "docs/CHUMMER5_CHARACTER_SETTINGS_CONTRACT.generated.json"
      - "docs/editability-evidence/**"
      - "global.json"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api36-editing-e2e.yml"
      - "docs/ANDROID_CHUMMER5_EDITABILITY_INVENTORY.generated.json"
      - "docs/CHUMMER5_CHARACTER_SETTINGS_CONTRACT.generated.json"
      - "docs/editability-evidence/**"
      - "global.json"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: api36-editing-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x64 native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      apk-artifact-id: ${{ steps.upload-apk.outputs.artifact-id }}
      apk-artifact-digest: ${{ steps.upload-apk.outputs.artifact-digest }}
      apk-artifact-name: ${{ steps.apk.outputs.artifact-name }}
      apk-artifact-attempt: ${{ steps.apk.outputs.artifact-attempt }}
      apk-sha256: ${{ steps.apk.outputs.apk-sha256 }}
    steps:
      - name: Check out the Android candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned presentation dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui
          ref: e906ec909d337b7a907ba7ae8c526c3aad89a1e3
          path: chummer-presentation
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned engine dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-core
          ref: e9874a31d8d25b98dd196dd629c423e9a9c39297
          path: chummer-core-engine
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned Hub contract dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub
          ref: d29a880f624ec94aabedd0c2901ae8fed2f93ed4
          path: chummer.run-services
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned registry contract dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub-registry
          ref: af9a7e19c3bf331e96411dfb8f9e7820a98cab29
          path: chummer-hub-registry
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned UI kit dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui-kit
          ref: d51ecd99cf72098d4adc8db0192bff7bf9fd8e61
          path: chummer-ui-kit
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned media contract dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-media-factory
          ref: 415c8163d3d90b1211e4014fef332bdec6d75f73
          path: fleet/repos/chummer-media-factory
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned Android parity registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-design
          ref: a833259208c92e75620850f104bff8718077e0d3
          path: chummer-design
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned Chummer5 UI authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer5a
          ref: fe4355d06c98cd9b7feade89f5fc1a0e438f7ce3
          path: chummer5a
          persist-credentials: false
          fetch-depth: 1

      - name: Verify phone editability inventory truth
        working-directory: chummer-android
        env:
          CHUMMER_COMPLETE_ROOT: ${{ github.workspace }}
          CHUMMER5A_ROOT: ${{ github.workspace }}/chummer5a
        run: |
          python3 scripts/materialize_chummer5_editability_inventory.py --check
          python3 scripts/materialize_chummer5_character_settings_contract.py --check

      - name: Verify the pinned canonical Android content manifest
        run: >-
          python3 chummer-android/scripts/verify_android_content_bundle.py
          --repo-root chummer-android
          --core-root chummer-core-engine
          --check

      - name: Install the governed .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.110

      - name: Restore the pinned MAUI Android workload
        run: dotnet workload restore chummer-android/Chummer.Android.slnx

      - name: Build the emulator APK and native compile gate
        working-directory: chummer-android
        env:
          CHUMMER_ANDROID_RUNTIME_ID: android-x64
        run: scripts/build-debug.sh

      - name: Seal the unique signed debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(
            find chummer-android/src/Chummer.Android/bin/Debug/net10.0-android36.0 \
              -type f -name '*-Signed.apk' -print
          )
          test "${#apks[@]}" -eq 1
          install -d -m 0755 "$RUNNER_TEMP/chummer-android-apk"
          install -m 0644 \
            "${apks[0]}" \
            "$RUNNER_TEMP/chummer-android-apk/chummer-android-x64-debug.apk"
          (
            cd "$RUNNER_TEMP/chummer-android-apk"
            apk_sha256="$(sha256sum chummer-android-x64-debug.apk | cut -d ' ' -f 1)"
            printf '%s  %s\n' \
              "$apk_sha256" \
              chummer-android-x64-debug.apk \
              >chummer-android-x64-debug.apk.sha256
            sha256sum --check chummer-android-x64-debug.apk.sha256
            {
              echo "apk-sha256=$apk_sha256"
              echo "artifact-name=chummer-android-api36-x64-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              echo "artifact-attempt=${GITHUB_RUN_ATTEMPT}"
            } >>"$GITHUB_OUTPUT"
          )

      - name: Verify canonical content in the exact signed APK
        run: >-
          python3 chummer-android/scripts/verify_android_content_bundle.py
          --repo-root chummer-android
          --core-root chummer-core-engine
          --apk "$RUNNER_TEMP/chummer-android-apk/chummer-android-x64-debug.apk"
          --receipt "$RUNNER_TEMP/chummer-android-apk/chummer-android-content-bundle-receipt.json"
          --check

      - name: Upload the exact APK under test
        id: upload-apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.apk.outputs.artifact-name }}
          path: ${{ runner.temp }}/chummer-android-apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  physical-arm64-apk:
    name: Build isolated arm64-v8a physical APK
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHUMMER_PHYSICAL_PACKAGE_ID: com.myexternalbrain.chummer.codexproof.arm64
    outputs:
      apk-artifact-id: ${{ steps.upload-physical-apk.outputs.artifact-id }}
      apk-artifact-digest: ${{ steps.upload-physical-apk.outputs.artifact-digest }}
      apk-artifact-name: ${{ steps.physical-apk.outputs.artifact-name }}
      apk-artifact-attempt: ${{ steps.physical-apk.outputs.artifact-attempt }}
      apk-sha256: ${{ steps.physical-apk.outputs.apk-sha256 }}
      package-id: ${{ steps.physical-apk.outputs.package-id }}
      signing-certificate-sha256: ${{ steps.physical-apk.outputs.signing-certificate-sha256 }}
    steps:
      - name: Check out the exact Android candidate for arm64
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned presentation dependency for arm64
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui
          ref: e906ec909d337b7a907ba7ae8c526c3aad89a1e3
          path: chummer-presentation
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned engine dependency for arm64
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-core
          ref: e9874a31d8d25b98dd196dd629c423e9a9c39297
          path: chummer-core-engine
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned Hub contract dependencies for arm64
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub
          ref: d29a880f624ec94aabedd0c2901ae8fed2f93ed4
          path: chummer.run-services
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned registry contract dependency for arm64
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub-registry
          ref: af9a7e19c3bf331e96411dfb8f9e7820a98cab29
          path: chummer-hub-registry
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned UI kit dependency for arm64
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui-kit
          ref: d51ecd99cf72098d4adc8db0192bff7bf9fd8e61
          path: chummer-ui-kit
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned media contract dependency for arm64
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-media-factory
          ref: 415c8163d3d90b1211e4014fef332bdec6d75f73
          path: fleet/repos/chummer-media-factory
          persist-credentials: false
          fetch-depth: 1

      - name: Install the governed .NET SDK for arm64
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.110

      - name: Restore the pinned MAUI Android workload for arm64
        run: dotnet workload restore chummer-android/Chummer.Android.slnx

      - name: Build the isolated arm64-v8a physical APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore chummer-android/Chummer.Android.slnx \
            --disable-parallel \
            -p:ChummerAndroidRuntimeIdentifier=android-arm64 \
            -p:ApplicationId="$CHUMMER_PHYSICAL_PACKAGE_ID" \
            -p:ChummerDesktopRuntimeIdentifiers= \
            -p:ChummerUseLocalCompatibilityTree=true
          dotnet build chummer-android/src/Chummer.Android/Chummer.Android.csproj \
            --configuration Debug \
            --framework net10.0-android36.0 \
            --no-restore \
            -m:1 \
            --disable-build-servers \
            -p:UseSharedCompilation=false \
            -p:BuildInParallel=false \
            -p:ChummerAndroidRuntimeIdentifier=android-arm64 \
            -p:ApplicationId="$CHUMMER_PHYSICAL_PACKAGE_ID" \
            -p:ChummerDesktopRuntimeIdentifiers= \
            -p:ChummerUseLocalCompatibilityTree=true

      - name: Seal and verify the isolated arm64-v8a physical APK
        id: physical-apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(
            find chummer-android/src/Chummer.Android/bin/Debug/net10.0-android36.0 \
              -path '*/android-arm64/*' -type f -name '*-Signed.apk' -print
          )
          test "${#apks[@]}" -eq 1
          authority_dir="$RUNNER_TEMP/chummer-android-arm64-physical-apk"
          install -d -m 0755 "$authority_dir"
          install -m 0644 \
            "${apks[0]}" \
            "$authority_dir/chummer-android-arm64-physical-debug.apk"
          apk="$authority_dir/chummer-android-arm64-physical-debug.apk"
          apk_sha256="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          printf '%s  %s\n' \
            "$apk_sha256" \
            chummer-android-arm64-physical-debug.apk \
            >"$authority_dir/chummer-android-arm64-physical-debug.apk.sha256"
          (
            cd "$authority_dir"
            sha256sum --check chummer-android-arm64-physical-debug.apk.sha256
          )
          APK="$apk" python3 - <<'PY'
          import os
          import zipfile

          with zipfile.ZipFile(os.environ["APK"]) as archive:
              abis = sorted({
                  name.split("/", 2)[1]
                  for name in archive.namelist()
                  if name.startswith("lib/") and name.count("/") >= 2
              })
          if abis != ["arm64-v8a"]:
              raise SystemExit(f"expected exact arm64-v8a ABI set, found {abis!r}")
          print("verified APK ABI set: arm64-v8a")
          PY
          build_tools="$(
            find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print \
              | sort -V \
              | tail -n 1
          )"
          test -n "$build_tools"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" \
            >"$authority_dir/apksigner-verify.txt"
          grep -qx 'Verifies' "$authority_dir/apksigner-verify.txt"
          grep -Eq '^Verified using v[23] scheme.*: true$' \
            "$authority_dir/apksigner-verify.txt"
          signing_certificate_sha256="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              "$authority_dir/apksigner-verify.txt" \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          )"
          [[ "$signing_certificate_sha256" =~ ^[0-9a-f]{64}$ ]]
          package_id="$(
            "$build_tools/aapt" dump badging "$apk" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
              | head -n 1
          )"
          test "$package_id" = "$CHUMMER_PHYSICAL_PACKAGE_ID"
          {
            echo "apk-sha256=$apk_sha256"
            echo "package-id=$package_id"
            echo "signing-certificate-sha256=$signing_certificate_sha256"
            echo "artifact-name=chummer-android-api36-arm64-physical-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "artifact-attempt=${GITHUB_RUN_ATTEMPT}"
          } >>"$GITHUB_OUTPUT"

      - name: Verify canonical content in the exact arm64-v8a APK
        run: >-
          python3 chummer-android/scripts/verify_android_content_bundle.py
          --repo-root chummer-android
          --core-root chummer-core-engine
          --apk "$RUNNER_TEMP/chummer-android-arm64-physical-apk/chummer-android-arm64-physical-debug.apk"
          --receipt "$RUNNER_TEMP/chummer-android-arm64-physical-apk/chummer-android-content-bundle-receipt.json"
          --check

      - name: Bind the physical APK provenance receipt
        shell: bash
        env:
          APK_SHA256: ${{ steps.physical-apk.outputs.apk-sha256 }}
          PACKAGE_ID: ${{ steps.physical-apk.outputs.package-id }}
          SIGNING_CERTIFICATE_SHA256: ${{ steps.physical-apk.outputs.signing-certificate-sha256 }}
        run: |
          set -euo pipefail
          authority_dir="$RUNNER_TEMP/chummer-android-arm64-physical-apk"
          AUTHORITY_DIR="$authority_dir" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          authority_dir = Path(os.environ["AUTHORITY_DIR"])
          content_path = authority_dir / "chummer-android-content-bundle-receipt.json"
          content_bytes = content_path.read_bytes()
          content = json.loads(content_bytes)
          apk_sha256 = os.environ["APK_SHA256"]
          if content.get("status") != "pass" or content.get("apkVerified") is not True:
              raise SystemExit("canonical content receipt is not passing")
          if content.get("apkSha256") != apk_sha256:
              raise SystemExit("canonical content receipt APK digest mismatch")
          receipt = {
              "schema": "chummer.android.physical-apk/v1",
              "status": "pass",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "headSha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runtimeIdentifier": "android-arm64",
              "abi": "arm64-v8a",
              "distributionLane": "isolated-physical-proof",
              "signingPosture": "ephemeral-hosted-debug-one-shot",
              "stableUpdateSigningClaim": False,
              "playBetaSigningClaim": False,
              "packageId": os.environ["PACKAGE_ID"],
              "signingCertificateSha256": os.environ["SIGNING_CERTIFICATE_SHA256"],
              "apkFile": "chummer-android-arm64-physical-debug.apk",
              "apkSha256": apk_sha256,
              "contentReceiptFile": content_path.name,
              "contentReceiptSha256": hashlib.sha256(content_bytes).hexdigest(),
              "contentBundleDigest": content.get("bundleDigest"),
              "contentManifestSha256": content.get("manifestSha256"),
              "coreRevision": content.get("coreRevision"),
          }
          target = authority_dir / "chummer-android-arm64-physical-provenance.json"
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (authority_dir / "chummer-android-arm64-physical-provenance.json.sha256").write_text(
              f"{digest}  {target.name}\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$authority_dir"
            sha256sum --check chummer-android-arm64-physical-provenance.json.sha256
          )

      - name: Upload the exact isolated arm64-v8a physical APK authority
        id: upload-physical-apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.physical-apk.outputs.artifact-name }}
          path: ${{ runner.temp }}/chummer-android-arm64-physical-apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  phone-editing-e2e:
    # Tablet acceptance is deferred; this lane launches only pixel_6 and makes no tablet-readiness claim.
    name: phone API 36 persistence (${{ matrix.journey }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        journey:
          - full-editing
          - creation-prerequisite
          - career-active-skill-advance
          - career-weapon-fire
          - career-notoriety
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CHUMMER_E2E_PROFILE: phone
      CHUMMER_E2E_JOURNEY: ${{ matrix.journey }}
      CHUMMER_E2E_APK_ARTIFACT_ID: ${{ needs.build.outputs.apk-artifact-id }}
      CHUMMER_E2E_APK_ARTIFACT_DIGEST: ${{ needs.build.outputs.apk-artifact-digest }}
      CHUMMER_E2E_APK_ARTIFACT_NAME: ${{ needs.build.outputs.apk-artifact-name }}
      CHUMMER_E2E_APK_ARTIFACT_ATTEMPT: ${{ needs.build.outputs.apk-artifact-attempt }}
      CHUMMER_E2E_APK_SHA256: ${{ needs.build.outputs.apk-sha256 }}
    steps:
      - name: Check out the exact E2E driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the typed-mutation presentation evidence graph
        if: ${{ matrix.journey == 'career-active-skill-advance' || matrix.journey == 'career-weapon-fire' || matrix.journey == 'career-notoriety' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui
          ref: e906ec909d337b7a907ba7ae8c526c3aad89a1e3
          path: chummer-presentation
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the typed-mutation Core evidence graph
        if: ${{ matrix.journey == 'career-active-skill-advance' || matrix.journey == 'career-weapon-fire' || matrix.journey == 'career-notoriety' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-core
          ref: e9874a31d8d25b98dd196dd629c423e9a9c39297
          path: chummer-core-engine
          persist-credentials: false
          fetch-depth: 1

      - name: Download the exact APK under test
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.apk-artifact-id }}
          path: ${{ runner.temp }}/chummer-android-apk
          merge-multiple: true

      - name: Verify the shared portable APK authority
        working-directory: ${{ runner.temp }}/chummer-android-apk
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHUMMER_E2E_APK_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHUMMER_E2E_APK_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          [[ "$CHUMMER_E2E_APK_ARTIFACT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHUMMER_E2E_APK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CHUMMER_E2E_APK_ARTIFACT_NAME" = \
            "chummer-android-api36-x64-debug-${GITHUB_RUN_ID}-${CHUMMER_E2E_APK_ARTIFACT_ATTEMPT}"
          sha256sum --check chummer-android-x64-debug.apk.sha256
          actual_sha256="$(sha256sum chummer-android-x64-debug.apk | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$CHUMMER_E2E_APK_SHA256"

      - name: Enable KVM for the disposable emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the isolated native persistence journey
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          disable-animations: true
          script: bash chummer-android/scripts/run-api36-editing-e2e-ci.sh

      - name: Upload phone receipts and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chummer-android-api36-phone-${{ matrix.journey }}-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/chummer-api36-evidence/phone/${{ matrix.journey }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          # Stable per-journey names make rerun-failed replace only that journey.
          # A failed rerun cannot leave an earlier passing receipt authoritative.
          overwrite: true
          include-hidden-files: false

  phone-evidence-aggregate:
    name: Aggregate exact API 36 phone evidence
    needs:
      - build
      - phone-editing-e2e
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact aggregate verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Download the five stable journey evidence artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: chummer-android-api36-phone-*-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/chummer-api36-journey-evidence
          merge-multiple: false

      - name: Require one shared authority and exactly five passing journeys
        env:
          CHUMMER_BUILD_RESULT: ${{ needs.build.result }}
          CHUMMER_MATRIX_RESULT: ${{ needs.phone-editing-e2e.result }}
          CHUMMER_E2E_APK_ARTIFACT_ID: ${{ needs.build.outputs.apk-artifact-id }}
          CHUMMER_E2E_APK_ARTIFACT_DIGEST: ${{ needs.build.outputs.apk-artifact-digest }}
          CHUMMER_E2E_APK_ARTIFACT_NAME: ${{ needs.build.outputs.apk-artifact-name }}
          CHUMMER_E2E_APK_ARTIFACT_ATTEMPT: ${{ needs.build.outputs.apk-artifact-attempt }}
          CHUMMER_E2E_APK_SHA256: ${{ needs.build.outputs.apk-sha256 }}
        run: >-
          python3 chummer-android/scripts/verify-api36-editing-e2e-aggregate.py
          --evidence-root "${{ runner.temp }}/chummer-api36-journey-evidence"
          --receipt "${{ runner.temp }}/chummer-api36-aggregate/receipt.json"
          --run-id "${{ github.run_id }}"
          --build-result "$CHUMMER_BUILD_RESULT"
          --matrix-result "$CHUMMER_MATRIX_RESULT"
          --artifact-id "$CHUMMER_E2E_APK_ARTIFACT_ID"
          --artifact-digest "$CHUMMER_E2E_APK_ARTIFACT_DIGEST"
          --artifact-name "$CHUMMER_E2E_APK_ARTIFACT_NAME"
          --artifact-attempt "$CHUMMER_E2E_APK_ARTIFACT_ATTEMPT"
          --apk-sha256 "$CHUMMER_E2E_APK_SHA256"

      - name: Upload the aggregate phone authority receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chummer-android-api36-phone-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chummer-api36-aggregate/receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false
