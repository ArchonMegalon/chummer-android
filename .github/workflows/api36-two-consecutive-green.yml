name: API 36 ordered review-to-main green eligibility

on:
  workflow_dispatch:
    inputs:
      review_run_id:
        description: Exact successful pull_request API 36 run ID
        required: true
        type: string
      review_pull_request_number:
        description: Exact pull request proven by the reviewed run
        required: true
        type: string
      review_event_sha:
        description: Exact tested pull request merge commit from the review P0 authority
        required: true
        type: string
      main_run_id:
        description: Exact later successful refs/heads/main push API 36 run ID
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: api36-two-green-${{ github.repository }}-${{ inputs.main_run_id }}
  cancel-in-progress: false

jobs:
  verify-ordered-review-main-green:
    name: Verify an exact reviewed green followed by a later main green
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require an exact main dispatch and explicit run IDs
        shell: bash
        env:
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_PULL_REQUEST_NUMBER: ${{ inputs.review_pull_request_number }}
          REVIEW_EVENT_SHA: ${{ inputs.review_event_sha }}
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$REVIEW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MAIN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$REVIEW_RUN_ID" != "$MAIN_RUN_ID"

      - name: Check out the exact gate implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Query canonical Actions metadata and download exact proof archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_PULL_REQUEST_NUMBER: ${{ inputs.review_pull_request_number }}
          REVIEW_EVENT_SHA: ${{ inputs.review_event_sha }}
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chummer-api36-two-green-inputs"
          install -d -m 0700 "$evidence"
          for role in review main; do
            if test "$role" = review; then
              run_id="$REVIEW_RUN_ID"
            else
              run_id="$MAIN_RUN_ID"
            fi
            role_root="$evidence/$role"
            install -d -m 0700 "$role_root"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              >"$role_root/run.json"
            run_attempt="$(jq -er '.run_attempt | select(type == "number" and . >= 1 and floor == .)' "$role_root/run.json")"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$run_attempt/jobs?per_page=100" \
              >"$role_root/jobs.json"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              >"$role_root/artifacts.json"
            aggregate_name="chummer-android-api36-phone-sr5-wizard-aggregate-$run_id-$run_attempt"
            p0_name="chummer-android-p0-pr-authority-$run_id-$run_attempt"
            for kind in aggregate p0; do
              if test "$kind" = aggregate; then
                artifact_name="$aggregate_name"
              else
                artifact_name="$p0_name"
              fi
              count="$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.name == $name)] | length' "$role_root/artifacts.json")"
              test "$count" = 1
              artifact_id="$(jq -er --arg name "$artifact_name" '.artifacts[] | select(.name == $name) | .id | select(type == "number" and . >= 1 and floor == .)' "$role_root/artifacts.json")"
              gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                >"$role_root/$kind.zip"
            done
          done
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/pulls/$REVIEW_PULL_REQUEST_NUMBER" \
            >"$evidence/review/pull-request.json"
          review_head_sha="$(jq -er '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$evidence/review/run.json")"
          review_base_sha="$(jq -er '.base.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$evidence/review/pull-request.json")"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/commits/$review_head_sha/pulls" \
            >"$evidence/review/head-pull-requests.json"
          aggregate_job_id="$(jq -er --arg name 'Aggregate exact API 36 phone evidence' '[.jobs[] | select(.name == $name)] | if length == 1 then .[0].id else error("aggregate job cardinality differs") end | select(type == "number" and . >= 1 and floor == .)' "$evidence/review/jobs.json")"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/check-runs/$aggregate_job_id" \
            >"$evidence/review/aggregate-check-run.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/git/commits/$review_base_sha" \
            >"$evidence/review/base-commit.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/git/commits/$review_head_sha" \
            >"$evidence/review/head-commit.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/git/commits/$REVIEW_EVENT_SHA" \
            >"$evidence/review/event-commit.json"
          main_head_sha="$(jq -er '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$evidence/main/run.json")"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/git/commits/$main_head_sha" \
            >"$evidence/main/commit.json"

      - name: Materialize and replay eligibility without publication authority
        shell: bash
        env:
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_PULL_REQUEST_NUMBER: ${{ inputs.review_pull_request_number }}
          REVIEW_EVENT_SHA: ${{ inputs.review_event_sha }}
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chummer-api36-two-green-inputs"
          output_root="$RUNNER_TEMP/chummer-api36-two-green-output"
          install -d -m 0700 "$output_root"
          output="$output_root/ANDROID_API36_TWO_GREEN_ELIGIBILITY.generated.json"
          common=(
            --android-root "$GITHUB_WORKSPACE/chummer-android"
            --policy "$GITHUB_WORKSPACE/chummer-android/eng/api36-two-consecutive-green-authority.json"
            --environment-policy "$GITHUB_WORKSPACE/chummer-android/eng/api36-proof-environment-authority.json"
            --source-workflow "$GITHUB_WORKSPACE/chummer-android/.github/workflows/api36-editing-e2e.yml"
            --review-run-id "$REVIEW_RUN_ID"
            --review-pull-request-number "$REVIEW_PULL_REQUEST_NUMBER"
            --review-event-sha "$REVIEW_EVENT_SHA"
            --main-run-id "$MAIN_RUN_ID"
            --review-run "$evidence/review/run.json"
            --review-jobs "$evidence/review/jobs.json"
            --review-artifacts "$evidence/review/artifacts.json"
            --review-aggregate-archive "$evidence/review/aggregate.zip"
            --review-p0-archive "$evidence/review/p0.zip"
            --review-pull-request "$evidence/review/pull-request.json"
            --review-head-pull-requests "$evidence/review/head-pull-requests.json"
            --review-aggregate-check-run "$evidence/review/aggregate-check-run.json"
            --review-base-commit "$evidence/review/base-commit.json"
            --review-head-commit "$evidence/review/head-commit.json"
            --review-event-commit "$evidence/review/event-commit.json"
            --main-run "$evidence/main/run.json"
            --main-jobs "$evidence/main/jobs.json"
            --main-artifacts "$evidence/main/artifacts.json"
            --main-aggregate-archive "$evidence/main/aggregate.zip"
            --main-p0-archive "$evidence/main/p0.zip"
            --main-commit "$evidence/main/commit.json"
          )
          python3 chummer-android/scripts/materialize-api36-two-green-eligibility.py \
            materialize "${common[@]}" --output "$output"
          python3 chummer-android/scripts/materialize-api36-two-green-eligibility.py \
            verify "${common[@]}" --authority "$output"
          jq -e \
            '.eligible == true and .internalTestingEligible == true and .publicationAuthorized == false and .googlePlayUploadAuthorized == false' \
            "$output" >/dev/null

      - name: Upload the non-publication eligibility receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chummer-android-api36-two-green-eligibility-${{ inputs.review_run_id }}-${{ inputs.main_run_id }}
          path: ${{ runner.temp }}/chummer-api36-two-green-output/ANDROID_API36_TWO_GREEN_ELIGIBILITY.generated.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false
