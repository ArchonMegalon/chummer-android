name: API 36 phone beta editing E2E

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api36-editing-e2e.yml"
      - "docs/ANDROID_CHUMMER5_EDITABILITY_INVENTORY.generated.json"
      - "docs/CHUMMER5_CHARACTER_SETTINGS_CONTRACT.generated.json"
      - "docs/editability-evidence/**"
      - "global.json"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: api36-editing-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x64 emulator and ARM64 hosted debug candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      apk-artifact-id: ${{ steps.upload-apk.outputs.artifact-id }}
      apk-artifact-digest: ${{ steps.upload-apk.outputs.artifact-digest }}
      apk-artifact-name: ${{ steps.apk.outputs.artifact-name }}
      apk-artifact-attempt: ${{ steps.apk.outputs.artifact-attempt }}
      apk-sha256: ${{ steps.apk.outputs.apk-sha256 }}
      arm64-artifact-id: ${{ steps.upload-arm64.outputs.artifact-id }}
      arm64-artifact-digest: ${{ steps.upload-arm64.outputs.artifact-digest }}
      arm64-artifact-name: ${{ steps.arm64.outputs.artifact-name }}
      arm64-apk-sha256: ${{ steps.arm64.outputs.apk-sha256 }}
    steps:
      - name: Check out the Android candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned presentation dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui
          ref: 1438978f6f883be321c62de69165c9216e10e011
          path: chummer-presentation
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            Chummer.Desktop.Runtime
            Chummer.Presentation
            # The generated parity inventory authenticates exact legacy
            # implementation and reviewed-test anchors from this pinned tree.
            Chummer
            Chummer.Tests

      - name: Check out the pinned engine dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-core
          ref: febd698752e195dceef79fbc3f83dc971564fe00
          path: chummer-core-engine
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned canonical Android content source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-core
          ref: 3260ac73714d8b001a3599d6776196e394dc6c35
          path: chummer-core-content
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            Chummer/data
            Chummer/lang

      - name: Check out the pinned Hub contract dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub
          ref: 8cc22cb6fdf9bdf2af3c390125f7a88de90700b3
          path: chummer.run-services
          persist-credentials: false
          fetch-depth: 1
          # The Hub repository contains large runtime media that is not part of
          # the Android compile graph. Keep the exact commit pin, but hydrate
          # only the three contract projects consumed by Presentation.
          sparse-checkout: |
            Chummer.Campaign.Contracts
            Chummer.Play.Contracts
            Chummer.Run.Contracts

      - name: Check out the pinned registry contract dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub-registry
          ref: af9a7e19c3bf331e96411dfb8f9e7820a98cab29
          path: chummer-hub-registry
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: Chummer.Hub.Registry.Contracts

      - name: Check out the pinned UI kit dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui-kit
          ref: d51ecd99cf72098d4adc8db0192bff7bf9fd8e61
          path: chummer-ui-kit
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: src/Chummer.Ui.Kit

      - name: Check out the pinned media contract dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-media-factory
          ref: 415c8163d3d90b1211e4014fef332bdec6d75f73
          path: fleet/repos/chummer-media-factory
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: src/Chummer.Media.Contracts

      - name: Check out the pinned Android parity registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-design
          ref: c60c93f635e371d784812140f5d5181d1d954ae2
          path: chummer-design
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            products/chummer
            scripts/ai

      - name: Check out the pinned Chummer5 UI authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer5a
          ref: fe4355d06c98cd9b7feade89f5fc1a0e438f7ce3
          path: chummer5a
          persist-credentials: false
          fetch-depth: 1
          # Keep every source root consumed by the fail-closed inventory. The
          # optional product roots affect the generated fingerprint when they
          # exist, so omitting them would honestly fail --check.
          sparse-checkout: |
            Chummer
            Plugins/ChummerHub.Client/UI
            Translator
            CrashHandler
            ChummerDataViewer

      - name: Verify phone editability inventory truth
        working-directory: chummer-android
        env:
          CHUMMER_COMPLETE_ROOT: ${{ github.workspace }}
          CHUMMER5A_ROOT: ${{ github.workspace }}/chummer5a
        run: |
          python3 scripts/materialize_chummer5_editability_inventory.py --check
          python3 scripts/materialize_chummer5_character_settings_contract.py --check

      - name: Verify the pinned phone-beta contract
        run: python3 chummer-design/scripts/ai/validate_android_phone_beta_contract.py

      - name: Verify the pinned canonical Android content manifest
        run: >-
          python3 chummer-android/scripts/verify_android_content_bundle.py
          --repo-root chummer-android
          --core-root chummer-core-content
          --check

      - name: Install the governed .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.110

      - name: Restore the pinned MAUI Android workload
        run: dotnet workload restore chummer-android/Chummer.Android.slnx

      - name: Verify clean Android source before local-compatibility restores
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C chummer-android status --porcelain=v1 --untracked-files=no)"

      - name: Build the emulator APK and native compile gate
        working-directory: chummer-android
        env:
          CHUMMER_ANDROID_RUNTIME_ID: android-x64
          CHUMMER_CORE_ENGINE_ROOT: ${{ github.workspace }}/chummer-core-engine
        run: scripts/build-debug.sh

      - name: Verify clean Android source after x64 local-compatibility restore
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C chummer-android status --porcelain=v1 --untracked-files=no)"

      - name: Seal the unique signed debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(
            find chummer-android/src/Chummer.Android/bin/Debug/net10.0-android36.0 \
              -type f -name '*-Signed.apk' -print
          )
          test "${#apks[@]}" -eq 1
          install -d -m 0755 "$RUNNER_TEMP/chummer-android-apk"
          install -m 0644 \
            "${apks[0]}" \
            "$RUNNER_TEMP/chummer-android-apk/chummer-android-x64-debug.apk"
          (
            cd "$RUNNER_TEMP/chummer-android-apk"
            apk_sha256="$(sha256sum chummer-android-x64-debug.apk | cut -d ' ' -f 1)"
            printf '%s  %s\n' \
              "$apk_sha256" \
              chummer-android-x64-debug.apk \
              >chummer-android-x64-debug.apk.sha256
            sha256sum --check chummer-android-x64-debug.apk.sha256
            {
              echo "apk-sha256=$apk_sha256"
              echo "artifact-name=chummer-android-api36-x64-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              echo "artifact-attempt=${GITHUB_RUN_ATTEMPT}"
            } >>"$GITHUB_OUTPUT"
          )

      - name: Verify canonical content in the exact signed APK
        run: >-
          python3 chummer-android/scripts/verify_android_content_bundle.py
          --repo-root chummer-android
          --core-root chummer-core-content
          --apk "$RUNNER_TEMP/chummer-android-apk/chummer-android-x64-debug.apk"
          --receipt "$RUNNER_TEMP/chummer-android-apk/chummer-android-content-bundle-receipt.json"
          --check

      - name: Upload the exact APK under test
        id: upload-apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.apk.outputs.artifact-name }}
          path: ${{ runner.temp }}/chummer-android-apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Build the ARM64 hosted debug candidate
        working-directory: chummer-android
        env:
          CHUMMER_ANDROID_RUNTIME_ID: android-arm64
          CHUMMER_CORE_ENGINE_ROOT: ${{ github.workspace }}/chummer-core-engine
        run: scripts/build-debug.sh

      - name: Seal ARM64 hosted debug candidate observation
        id: arm64
        shell: bash
        run: |
          set -euo pipefail
          arm64_apk="chummer-android/src/Chummer.Android/bin/Debug/net10.0-android36.0/android-arm64/com.myexternalbrain.chummer-Signed.apk"
          test -f "$arm64_apk"
          install -d -m 0755 "$RUNNER_TEMP/chummer-android-arm64"
          install -m 0644 "$arm64_apk" \
            "$RUNNER_TEMP/chummer-android-arm64/chummer-android-arm64-debug.apk"
          python3 chummer-android/scripts/verify_android_content_bundle.py \
            --repo-root "$GITHUB_WORKSPACE/chummer-android" \
            --core-root "$GITHUB_WORKSPACE/chummer-core-content" \
            --apk "$RUNNER_TEMP/chummer-android-arm64/chummer-android-arm64-debug.apk" \
            --receipt "$RUNNER_TEMP/chummer-android-arm64/canonical-content-receipt.json" \
            --check
          python3 chummer-android/scripts/materialize-api36-hosted-arm64-candidate.py \
            materialize \
            --source android https://github.com/ArchonMegalon/chummer-android.git "$GITHUB_SHA" "$GITHUB_WORKSPACE/chummer-android" \
            --source presentation https://github.com/ArchonMegalon/chummer6-ui.git 1438978f6f883be321c62de69165c9216e10e011 "$GITHUB_WORKSPACE/chummer-presentation" \
            --source core-runtime https://github.com/ArchonMegalon/chummer6-core.git febd698752e195dceef79fbc3f83dc971564fe00 "$GITHUB_WORKSPACE/chummer-core-engine" \
            --source core-content https://github.com/ArchonMegalon/chummer6-core.git 3260ac73714d8b001a3599d6776196e394dc6c35 "$GITHUB_WORKSPACE/chummer-core-content" \
            --source hub https://github.com/ArchonMegalon/chummer6-hub.git 8cc22cb6fdf9bdf2af3c390125f7a88de90700b3 "$GITHUB_WORKSPACE/chummer.run-services" \
            --source registry https://github.com/ArchonMegalon/chummer6-hub-registry.git af9a7e19c3bf331e96411dfb8f9e7820a98cab29 "$GITHUB_WORKSPACE/chummer-hub-registry" \
            --source ui-kit https://github.com/ArchonMegalon/chummer6-ui-kit.git d51ecd99cf72098d4adc8db0192bff7bf9fd8e61 "$GITHUB_WORKSPACE/chummer-ui-kit" \
            --source media https://github.com/ArchonMegalon/chummer6-media-factory.git 415c8163d3d90b1211e4014fef332bdec6d75f73 "$GITHUB_WORKSPACE/fleet/repos/chummer-media-factory" \
            --runtime android-arm64 \
            --application-id com.myexternalbrain.chummer \
            --apk "$RUNNER_TEMP/chummer-android-arm64/chummer-android-arm64-debug.apk" \
            --content-receipt "$RUNNER_TEMP/chummer-android-arm64/canonical-content-receipt.json" \
            --workflow "$GITHUB_WORKSPACE/chummer-android/.github/workflows/api36-editing-e2e.yml" \
            --build-script "$GITHUB_WORKSPACE/chummer-android/scripts/build-debug.sh" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-sha "$GITHUB_SHA" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --base-sha "${{ github.event.pull_request.base.sha || github.sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/chummer-android-arm64/hosted-build-candidate.json"
          apk_sha256="$(sha256sum "$RUNNER_TEMP/chummer-android-arm64/chummer-android-arm64-debug.apk" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$apk_sha256" chummer-android-arm64-debug.apk \
            >"$RUNNER_TEMP/chummer-android-arm64/chummer-android-arm64-debug.apk.sha256"
          {
            echo "apk-sha256=$apk_sha256"
            echo "artifact-name=chummer-android-api36-arm64-hosted-debug-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >>"$GITHUB_OUTPUT"

      - name: Upload ARM64 hosted debug candidate
        id: upload-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.arm64.outputs.artifact-name }}
          path: ${{ runner.temp }}/chummer-android-arm64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  phone-editing-e2e:
    # Tablet acceptance is deferred; this lane launches only pixel_6 and makes no tablet-readiness claim.
    name: phone API 36 persistence (${{ matrix.journey }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        journey:
          - full-editing
          - creation-prerequisite
          - career-active-skill-advance
          - career-weapon-fire
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CHUMMER_E2E_PROFILE: phone
      CHUMMER_E2E_JOURNEY: ${{ matrix.journey }}
      CHUMMER_E2E_APK_ARTIFACT_ID: ${{ needs.build.outputs.apk-artifact-id }}
      CHUMMER_E2E_APK_ARTIFACT_DIGEST: ${{ needs.build.outputs.apk-artifact-digest }}
      CHUMMER_E2E_APK_ARTIFACT_NAME: ${{ needs.build.outputs.apk-artifact-name }}
      CHUMMER_E2E_APK_ARTIFACT_ATTEMPT: ${{ needs.build.outputs.apk-artifact-attempt }}
      CHUMMER_E2E_APK_SHA256: ${{ needs.build.outputs.apk-sha256 }}
    steps:
      - name: Check out the exact E2E driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the typed-mutation presentation evidence graph
        if: ${{ matrix.journey == 'career-active-skill-advance' || matrix.journey == 'career-weapon-fire' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui
          ref: 1438978f6f883be321c62de69165c9216e10e011
          path: chummer-presentation
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the typed-mutation Core evidence graph
        if: ${{ matrix.journey == 'career-active-skill-advance' || matrix.journey == 'career-weapon-fire' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-core
          ref: febd698752e195dceef79fbc3f83dc971564fe00
          path: chummer-core-engine
          persist-credentials: false
          fetch-depth: 1

      - name: Download the exact APK under test
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.apk-artifact-id }}
          path: ${{ runner.temp }}/chummer-android-apk
          merge-multiple: true

      - name: Verify the shared portable APK authority
        working-directory: ${{ runner.temp }}/chummer-android-apk
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHUMMER_E2E_APK_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHUMMER_E2E_APK_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          [[ "$CHUMMER_E2E_APK_ARTIFACT_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHUMMER_E2E_APK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CHUMMER_E2E_APK_ARTIFACT_NAME" = \
            "chummer-android-api36-x64-debug-${GITHUB_RUN_ID}-${CHUMMER_E2E_APK_ARTIFACT_ATTEMPT}"
          sha256sum --check chummer-android-x64-debug.apk.sha256
          actual_sha256="$(sha256sum chummer-android-x64-debug.apk | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$CHUMMER_E2E_APK_SHA256"

      - name: Enable KVM for the disposable emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the isolated native persistence journey
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          disable-animations: true
          script: bash chummer-android/scripts/run-api36-editing-e2e-ci.sh

      - name: Upload phone receipts and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chummer-android-api36-phone-${{ matrix.journey }}-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/chummer-api36-evidence/phone/${{ matrix.journey }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          # Stable per-journey names make rerun-failed replace only that journey.
          # A failed rerun cannot leave an earlier passing receipt authoritative.
          overwrite: true
          include-hidden-files: false

  phone-evidence-aggregate:
    name: Aggregate exact API 36 phone evidence
    needs:
      - build
      - phone-editing-e2e
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact aggregate verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Download the four stable journey evidence artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: chummer-android-api36-phone-*-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/chummer-api36-journey-evidence
          merge-multiple: false

      - name: Require one shared authority and exactly four passing journeys
        env:
          CHUMMER_BUILD_RESULT: ${{ needs.build.result }}
          CHUMMER_MATRIX_RESULT: ${{ needs.phone-editing-e2e.result }}
          CHUMMER_E2E_APK_ARTIFACT_ID: ${{ needs.build.outputs.apk-artifact-id }}
          CHUMMER_E2E_APK_ARTIFACT_DIGEST: ${{ needs.build.outputs.apk-artifact-digest }}
          CHUMMER_E2E_APK_ARTIFACT_NAME: ${{ needs.build.outputs.apk-artifact-name }}
          CHUMMER_E2E_APK_ARTIFACT_ATTEMPT: ${{ needs.build.outputs.apk-artifact-attempt }}
          CHUMMER_E2E_APK_SHA256: ${{ needs.build.outputs.apk-sha256 }}
        run: >-
          python3 chummer-android/scripts/verify-api36-editing-e2e-aggregate.py
          --evidence-root "${{ runner.temp }}/chummer-api36-journey-evidence"
          --receipt "${{ runner.temp }}/chummer-api36-aggregate/receipt.json"
          --run-id "${{ github.run_id }}"
          --build-result "$CHUMMER_BUILD_RESULT"
          --matrix-result "$CHUMMER_MATRIX_RESULT"
          --artifact-id "$CHUMMER_E2E_APK_ARTIFACT_ID"
          --artifact-digest "$CHUMMER_E2E_APK_ARTIFACT_DIGEST"
          --artifact-name "$CHUMMER_E2E_APK_ARTIFACT_NAME"
          --artifact-attempt "$CHUMMER_E2E_APK_ARTIFACT_ATTEMPT"
          --apk-sha256 "$CHUMMER_E2E_APK_SHA256"

      - name: Upload the aggregate phone authority receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chummer-android-api36-phone-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chummer-api36-aggregate/receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false
