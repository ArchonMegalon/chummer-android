name: Preview.12 exact-main unsigned candidate producer

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact refs/heads/main commit proven by Two-Green
        required: true
        type: string
      two_green_run_id:
        description: Exact successful ordered review-to-main workflow run
        required: true
        type: string
      two_green_artifact_id:
        description: Exact Two-Green eligibility artifact ID
        required: true
        type: string
      two_green_receipt_sha256:
        description: Exact extracted eligibility receipt SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: preview12-unsigned-producer-${{ inputs.expected_main_sha }}-${{ inputs.two_green_artifact_id }}
  cancel-in-progress: false

jobs:
  produce:
    name: Produce exact unsigned Preview.12 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DOTNET_MULTILEVEL_LOOKUP: "0"
    steps:
      - name: Require explicit dormant-lane pins
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          TWO_GREEN_RUN_ID: ${{ inputs.two_green_run_id }}
          TWO_GREEN_ARTIFACT_ID: ${{ inputs.two_green_artifact_id }}
          TWO_GREEN_RECEIPT_SHA256: ${{ inputs.two_green_receipt_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TWO_GREEN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TWO_GREEN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TWO_GREEN_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out the exact main candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate and download the exact Two-Green receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          TWO_GREEN_RUN_ID: ${{ inputs.two_green_run_id }}
          TWO_GREEN_ARTIFACT_ID: ${{ inputs.two_green_artifact_id }}
          TWO_GREEN_RECEIPT_SHA256: ${{ inputs.two_green_receipt_sha256 }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/preview12-two-green"
          install -d -m 0700 "$evidence"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TWO_GREEN_RUN_ID" >"$evidence/run.json"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" \
            '.status == "completed" and .conclusion == "success" and
             .event == "workflow_dispatch" and .head_branch == "main" and
             .head_sha == $sha and
             .path == ".github/workflows/api36-two-consecutive-green.yml"' \
            "$evidence/run.json" >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$TWO_GREEN_ARTIFACT_ID" \
            >"$evidence/artifact.json"
          artifact_digest="$(jq -er --argjson run "$TWO_GREEN_RUN_ID" \
            --argjson artifact "$TWO_GREEN_ARTIFACT_ID" \
            'select(.id == $artifact and .workflow_run.id == $run and .expired == false and
             (.name | startswith("chummer-android-api36-two-green-eligibility-"))) |
             .digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' \
            "$evidence/artifact.json")"
          test -n "$artifact_digest"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$TWO_GREEN_ARTIFACT_ID/zip" \
            >"$evidence/artifact.zip"
          python3 -I -E -S - "$evidence/artifact.zip" "$evidence" <<'PY'
          import pathlib, stat, sys, zipfile
          source, output = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          expected = "ANDROID_API36_TWO_GREEN_ELIGIBILITY.generated.json"
          with zipfile.ZipFile(source) as archive:
              rows = archive.infolist()
              if len(rows) != 1 or rows[0].filename != expected:
                  raise SystemExit("Two-Green artifact member set differs")
              row = rows[0]
              mode = (row.external_attr >> 16) & 0xffff
              if row.is_dir() or row.flag_bits & 1 or stat.S_IFMT(mode) == stat.S_IFLNK or row.file_size > 16 * 1024 * 1024:
                  raise SystemExit("Two-Green artifact member is unsafe")
              data = archive.read(row)
          target = output / expected
          target.write_bytes(data)
          target.chmod(0o600)
          PY
          receipt="$evidence/ANDROID_API36_TWO_GREEN_ELIGIBILITY.generated.json"
          test "$(sha256sum "$receipt" | cut -d ' ' -f 1)" = "$TWO_GREEN_RECEIPT_SHA256"
          printf '%s\n' "$artifact_digest" >"$evidence/artifact-digest.txt"

      - name: Check out the exact presentation dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui
          ref: a9e5bbd4fd44826177dd048b24417fad27397497
          path: chummer-presentation
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            Chummer.Desktop.Runtime
            Chummer.Presentation

      - name: Check out the exact Core runtime dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-core
          ref: 60112dccb6a3faad330d32c3c98eef0aa81d97af
          path: chummer-core-engine
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the exact Core content authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-core
          ref: c06f22c185c7b733637fdb76b3cf333f31716781
          path: chummer-core-content
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            Chummer/data
            Chummer/lang

      - name: Check out the exact Hub contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub
          ref: 4f335d6cebbd4101212fd2cc77265b50f252775c
          path: chummer.run-services
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            Chummer.Campaign.Contracts
            Chummer.Play.Contracts
            Chummer.Run.Contracts

      - name: Check out the exact Registry contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub-registry
          ref: af9a7e19c3bf331e96411dfb8f9e7820a98cab29
          path: chummer-hub-registry
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: Chummer.Hub.Registry.Contracts

      - name: Check out the exact UI Kit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui-kit
          ref: d51ecd99cf72098d4adc8db0192bff7bf9fd8e61
          path: chummer-ui-kit
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: src/Chummer.Ui.Kit

      - name: Check out the exact Media contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-media-factory
          ref: 415c8163d3d90b1211e4014fef332bdec6d75f73
          path: fleet/repos/chummer-media-factory
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: src/Chummer.Media.Contracts

      - name: Verify the exact Core content authority
        run: >-
          python3 -I -E -S
          chummer-android/scripts/verify_android_content_bundle.py
          --repo-root chummer-android
          --core-root chummer-core-content
          --check

      - name: Install the exact .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/preview12-dotnet-10.0.110
        with:
          dotnet-version: 10.0.110

      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore the pinned MAUI workload
        run: '"$RUNNER_TEMP/preview12-dotnet-10.0.110/dotnet" workload restore chummer-android/Chummer.Android.slnx'

      - name: Acquire the pinned public bundletool binary
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/preview12-public-tools"
          install -d -m 0700 "$tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$tools/bundletool-all-1.18.3.jar"
          test "$(sha256sum "$tools/bundletool-all-1.18.3.jar" | cut -d ' ' -f 1)" \
            = a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          chmod 0600 "$tools/bundletool-all-1.18.3.jar"

      - name: Build the exact unsigned Preview.12 candidate
        shell: bash
        env:
          CHUMMER_DOTNET: ${{ runner.temp }}/preview12-dotnet-10.0.110/dotnet
          CHUMMER_COMPLETE_ROOT: ${{ github.workspace }}
          CHUMMER_PREVIEW12_OUTPUT_DIR: ${{ runner.temp }}/preview12-producer
          CHUMMER_PRESENTATION_ROOT: ${{ github.workspace }}/chummer-presentation
          CHUMMER_CORE_ENGINE_ROOT: ${{ github.workspace }}/chummer-core-engine
          CHUMMER_RUN_SERVICES_ROOT: ${{ github.workspace }}/chummer.run-services
          CHUMMER_HUB_REGISTRY_ROOT: ${{ github.workspace }}/chummer-hub-registry
          CHUMMER_UI_KIT_ROOT: ${{ github.workspace }}/chummer-ui-kit
          CHUMMER_MEDIA_FACTORY_ROOT: ${{ github.workspace }}/fleet/repos/chummer-media-factory
        run: |
          set -euo pipefail
          install -d -m 0700 "$CHUMMER_PREVIEW12_OUTPUT_DIR"
          chummer-android/scripts/build-preview12-unsigned-candidate.sh

      - name: Validate and materialize the producer receipt
        shell: bash
        env:
          TWO_GREEN_RUN_ID: ${{ inputs.two_green_run_id }}
          TWO_GREEN_ARTIFACT_ID: ${{ inputs.two_green_artifact_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/preview12-producer"
          evidence="$RUNNER_TEMP/preview12-two-green"
          aab="$output/chummer-android-0.1.0-preview.12-unsigned.aab"
          bundletool="$RUNNER_TEMP/preview12-public-tools/bundletool-all-1.18.3.jar"
          java -jar "$bundletool" validate --bundle="$aab"
          java -jar "$bundletool" dump manifest --bundle="$aab" >"$output/AndroidManifest.xml"
          CHUMMER_EXPECTED_VERSION_NAME=0.1.0-preview.12 \
          CHUMMER_EXPECTED_VERSION_CODE=12 \
            python3 -I -E -S chummer-android/scripts/inspect_aab.py \
              "$aab" "$output/AndroidManifest.xml"
          python3 -I -E -S chummer-android/scripts/preview12_candidate_contract.py \
            capture-toolchain \
            --policy "$GITHUB_WORKSPACE/chummer-android/eng/preview12-unsigned-candidate-authority.json" \
            --dotnet "$RUNNER_TEMP/preview12-dotnet-10.0.110/dotnet" \
            --java-home "$JAVA_HOME" \
            --android-sdk "$ANDROID_SDK_ROOT" \
            --bundletool "$bundletool" \
            --runner-image "$ImageOS" \
            --runner-image-version "$ImageVersion" \
            --output "$output/PREVIEW12_TOOLCHAIN.generated.json"
          artifact_digest="$(cat "$evidence/artifact-digest.txt")"
          common=(
            --android-root "$GITHUB_WORKSPACE/chummer-android"
            --policy "$GITHUB_WORKSPACE/chummer-android/eng/preview12-unsigned-candidate-authority.json"
            --two-green "$evidence/ANDROID_API36_TWO_GREEN_ELIGIBILITY.generated.json"
            --toolchain "$output/PREVIEW12_TOOLCHAIN.generated.json"
            --aab "$aab"
            --manifest "$output/AndroidManifest.xml"
            --workflow "$GITHUB_WORKSPACE/chummer-android/.github/workflows/preview12-unsigned-candidate-producer.yml"
            --github-run-id "$GITHUB_RUN_ID"
            --github-run-attempt "$GITHUB_RUN_ATTEMPT_VALUE"
            --github-sha "$GITHUB_SHA"
            --github-ref "$GITHUB_REF"
            --two-green-run-id "$TWO_GREEN_RUN_ID"
            --two-green-artifact-id "$TWO_GREEN_ARTIFACT_ID"
            --two-green-artifact-digest "$artifact_digest"
          )
          python3 -I -E -S chummer-android/scripts/preview12_candidate_contract.py \
            producer "${common[@]}" --output "$output/PREVIEW12_UNSIGNED_CANDIDATE.generated.json"
          python3 -I -E -S chummer-android/scripts/preview12_candidate_contract.py \
            verify-producer "${common[@]}" --receipt "$output/PREVIEW12_UNSIGNED_CANDIDATE.generated.json"
          install -m 0600 "$evidence/ANDROID_API36_TWO_GREEN_ELIGIBILITY.generated.json" \
            "$output/ANDROID_API36_TWO_GREEN_ELIGIBILITY.generated.json"
          (cd "$output" && sha256sum \
            AndroidManifest.xml \
            PREVIEW12_TOOLCHAIN.generated.json \
            PREVIEW12_UNSIGNED_CANDIDATE.generated.json \
            ANDROID_API36_TWO_GREEN_ELIGIBILITY.generated.json \
            chummer-android-0.1.0-preview.12-unsigned.aab >SHA256SUMS)

      - name: Upload the unsigned candidate only
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chummer-android-preview12-unsigned-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/preview12-producer/chummer-android-0.1.0-preview.12-unsigned.aab
            ${{ runner.temp }}/preview12-producer/AndroidManifest.xml
            ${{ runner.temp }}/preview12-producer/PREVIEW12_TOOLCHAIN.generated.json
            ${{ runner.temp }}/preview12-producer/PREVIEW12_UNSIGNED_CANDIDATE.generated.json
            ${{ runner.temp }}/preview12-producer/ANDROID_API36_TWO_GREEN_ELIGIBILITY.generated.json
            ${{ runner.temp }}/preview12-producer/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
