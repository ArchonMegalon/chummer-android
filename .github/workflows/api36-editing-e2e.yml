name: API 36 phone and tablet editing E2E

on:
  pull_request:
    paths:
      - ".github/workflows/api36-editing-e2e.yml"
      - "global.json"
      - "scripts/build-debug.sh"
      - "src/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api36-editing-e2e.yml"
      - "global.json"
      - "scripts/build-debug.sh"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api36-editing-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x64 native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the Android candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned presentation dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui
          ref: 4333e546cb22daecb6b8d042f080c6a58cfef5f5
          path: chummer-presentation
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned engine dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-core
          ref: 8a736655c5d81487c3be8d87c63cef5cfcce87d4
          path: chummer-core-engine
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned Hub contract dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub
          ref: 972311c4408a51ede76224a66ae103e75cb2e53c
          path: chummer.run-services
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned registry contract dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-hub-registry
          ref: 7b54afec574a9327616c4ad7566da3a7b6b906a5
          path: chummer-hub-registry
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned UI kit dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchonMegalon/chummer6-ui-kit
          ref: d51ecd99cf72098d4adc8db0192bff7bf9fd8e61
          path: chummer-ui-kit
          persist-credentials: false
          fetch-depth: 1

      - name: Install the governed .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.110

      - name: Restore the pinned MAUI Android workload
        run: dotnet workload restore chummer-android/Chummer.Android.slnx

      - name: Build the emulator APK and native compile gate
        working-directory: chummer-android
        env:
          CHUMMER_ANDROID_RUNTIME_ID: android-x64
        run: scripts/build-debug.sh

      - name: Seal the unique signed debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(
            find chummer-android/src/Chummer.Android/bin/Debug/net10.0-android36.0 \
              -type f -name '*-Signed.apk' -print
          )
          test "${#apks[@]}" -eq 1
          install -d -m 0755 "$RUNNER_TEMP/chummer-android-apk"
          install -m 0644 \
            "${apks[0]}" \
            "$RUNNER_TEMP/chummer-android-apk/chummer-android-x64-debug.apk"
          sha256sum \
            "$RUNNER_TEMP/chummer-android-apk/chummer-android-x64-debug.apk" \
            >"$RUNNER_TEMP/chummer-android-apk/chummer-android-x64-debug.apk.sha256"

      - name: Upload the exact APK under test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chummer-android-api36-x64-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chummer-android-apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  editing-e2e:
    name: ${{ matrix.profile }} API 36 persistence
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: phone
            avd_profile: pixel_6
          - profile: tablet
            avd_profile: pixel_c
    env:
      CHUMMER_E2E_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Check out the exact E2E driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chummer-android
          persist-credentials: false
          fetch-depth: 1

      - name: Download the exact APK under test
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chummer-android-api36-x64-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chummer-android-apk

      - name: Enable KVM for the disposable emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the native editing and process-restart journey
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.avd_profile }}
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          disable-animations: true
          script: |
            set -euo pipefail
            evidence_root="$RUNNER_TEMP/chummer-api36-evidence/$CHUMMER_E2E_PROFILE"
            install -d -m 0755 "$evidence_root"
            python3 chummer-android/tests/run_api36_editing_e2e.py \
              --adb "$ANDROID_HOME/platform-tools/adb" \
              --apk "$RUNNER_TEMP/chummer-android-apk/chummer-android-x64-debug.apk" \
              --serial emulator-5554 \
              --profile "$CHUMMER_E2E_PROFILE" \
              --evidence "$evidence_root/screenshots" \
              --receipt "$evidence_root/receipt.json"

      - name: Upload phone or tablet receipts and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chummer-android-api36-${{ matrix.profile }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chummer-api36-evidence/${{ matrix.profile }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false
